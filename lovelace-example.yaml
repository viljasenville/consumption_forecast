# Example Lovelace cards.
# The hourly forecast is drawn directly from the sensor.consumption_forecast_hourly
# attribute. Requires the custom:apexcharts-card card (installable via HACS).

# --- Hourly consumption forecast (line) ---
type: custom:apexcharts-card
header:
  title: Consumption forecast (hourly)
  show: true
graph_span: 7d
span:
  start: hour
series:
  - entity: sensor.consumption_forecast_hourly
    name: Forecast
    unit: kWh
    data_generator: |
      return (entity.attributes.forecast || []).map(p => [
        new Date(p.datetime).getTime(), p.kwh
      ]);

